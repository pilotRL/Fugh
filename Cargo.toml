[package]
name = "fugh-ide"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A cross-platform IDE shell built with Rust and egui"
license = "MIT OR Apache-2.0"

[dependencies]
base64 = "0.23.1"
eframe = { version = "0.37.0", features = ["persistence"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["syntect", "serde"] }
libc = "0.2"
rfd = "0.17.2"
roxmltree = "0.21.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
