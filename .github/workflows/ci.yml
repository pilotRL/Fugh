name: Linux CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Install native GUI build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            cmake \
            desktop-file-utils \
            libasound2-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libx11-xcb-dev \
            libxcb-randr0-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            pkg-config

      - uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check Linux install script syntax
        run: bash -n packaging/linux/install-user.sh

      - name: Validate Linux desktop entry
        run: desktop-file-validate packaging/linux/fugh-ide.desktop

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --release --locked
